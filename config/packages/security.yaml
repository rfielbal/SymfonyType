security:
    # EXIGENCE 2 — Symfony choisit le hachage ; aucun mot de passe en clair en base.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # EXIGENCE 1 — Les comptes sont chargés depuis la base par leur email unique.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # EXIGENCE 5 — Refuse la connexion d'un compte suspendu.
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                default_target_path: app_profile
            logout:
                path: app_logout
                target: app_home
                enable_csrf: true
            # EXIGENCE 4 — Limite les essais ; seuil choisi pour ce projet.
            login_throttling:
                max_attempts: 3
                interval: '15 minutes'

    # EXIGENCE 5 — Deux rôles fixes : les administrateurs ont aussi les droits utilisateur.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]
    access_control:
        - { path: ^/admin(?:/|$), roles: ROLE_ADMIN }
        - { path: ^/profil(?:/|$), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Coût réduit uniquement pour accélérer les tests.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
