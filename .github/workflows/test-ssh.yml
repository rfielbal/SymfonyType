name: Test SSH

on:
  workflow_dispatch:

permissions: {}

jobs:
  connexion:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Tester la connexion au nuage 5183
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          # Prépare la clé et l'identité du serveur depuis les secrets.
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # Vérifie la connexion sans modifier le projet distant.
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" \
            'whoami; hostname'

      - name: Supprimer la clé temporaire
        if: always()
        run: rm -f ~/.ssh/deploy_key
